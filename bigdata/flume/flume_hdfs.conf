# ============================================================
# Flume 配置文件 - 采集系统访问日志到 HDFS
# 用法：flume-ng agent -n a1 -c conf -f flume_hdfs.conf
# ============================================================

# ---------- Agent 组件定义 ----------
a1.sources = r1
a1.sinks = k1
a1.channels = c1

# ---------- Source: 监控日志文件（exec模式，实时读取） ----------
a1.sources.r1.type = exec
a1.sources.r1.command = tail -F /opt/used-car/logs/access.log
a1.sources.r1.shell = /bin/bash -c
a1.sources.r1.channels = c1

# 可选：使用 spooldir 模式（监控目录，适合离线采集）
# a1.sources.r1.type = spooldir
# a1.sources.r1.spoolDir = /opt/used-car/logs/spool
# a1.sources.r1.fileSuffix = .COMPLETED
# a1.sources.r1.deletePolicy = never
# a1.sources.r1.ignorePattern = ^(.)*\\.tmp$

# ---------- Channel: 内存通道 ----------
a1.channels.c1.type = memory
a1.channels.c1.capacity = 10000
a1.channels.c1.transactionCapacity = 1000
a1.channels.c1.keep-alive = 30

# ---------- Sink: 写入 HDFS ----------
a1.sinks.k1.type = hdfs
a1.sinks.k1.channel = c1
a1.sinks.k1.hdfs.path = hdfs://localhost:9000/user/hive/warehouse/used_car/ods/ods_access_log/dt=%Y%m%d
a1.sinks.k1.hdfs.filePrefix = access-log
a1.sinks.k1.hdfs.fileType = DataStream
a1.sinks.k1.hdfs.writeFormat = Text
a1.sinks.k1.hdfs.useLocalTimeStamp = true
a1.sinks.k1.hdfs.round = true
a1.sinks.k1.hdfs.roundValue = 10
a1.sinks.k1.hdfs.roundUnit = minute
a1.sinks.k1.hdfs.rollInterval = 600
a1.sinks.k1.hdfs.rollSize = 134217728
a1.sinks.k1.hdfs.rollCount = 0
a1.sinks.k1.hdfs.idleTimeout = 0
a1.sinks.k1.hdfs.batchSize = 100
a1.sinks.k1.hdfs.threadsPoolSize = 10

# ---------- 拦截器：时间戳 ----------
a1.sources.r1.interceptors = i1
a1.sources.r1.interceptors.i1.type = timestamp
